<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Everything the app needs comes from this origin, so an escaping slip in a description or a receipt name cannot run as script. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self' https://nominatim.openstreetmap.org https://router.project-osrm.org https://www.fema.gov; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Itemizer</title>
<meta name="description" content="Accounts, transactions, budgets, cash flow, recurring bills, goals, and investments on your own device, with the deductions worksheet your tax preparer asks for.">
<meta name="theme-color" content="#0e6b52" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1412" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Itemizer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin referrerpolicy="no-referrer" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <a class="brand" href="#dashboard" aria-label="Itemizer home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="5" fill="currentColor"/><path d="M9 11h14M9 16h9M9 21h11" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round"/><circle cx="23" cy="20.5" r="3.2" fill="var(--accent-ink)"/></svg>
      <span class="brand-name">Itemizer</span>
    </a>
    <div class="topbar-right">
      <label class="year-pick" id="yearPick" hidden>
        <span class="year-pick-label">Tax year</span>
        <select id="yearSelect" aria-label="Tax year"></select>
      </label>
    </div>
  </header>

  <nav class="sidenav" aria-label="Sections">
    <div class="nav-group">
      <span class="nav-head">Money</span>
      <a id="tab-dashboard" class="nav-link" href="#dashboard" data-view="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 7h6V4h-6z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/></svg><span>Dashboard</span></a>
      <a id="tab-accounts" class="nav-link" href="#accounts" data-view="accounts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-5 9 5M5 10v7M10 10v7M14 10v7M19 10v7M3 20h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><span>Accounts</span></a>
      <a id="tab-transactions" class="nav-link" href="#transactions" data-view="transactions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg><span>Transactions</span></a>
      <a id="tab-cashflow" class="nav-link" href="#cashflow" data-view="cashflow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M15 6h5v5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><span>Cash flow</span></a>
      <a id="tab-budget" class="nav-link" href="#budget" data-view="budget"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 4v8l6 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><span>Budget</span></a>
      <a id="tab-recurring" class="nav-link" href="#recurring" data-view="recurring"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10a7 7 0 0 1 12-4l2 2M19 14a7 7 0 0 1-12 4l-2-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M19 4v4h-4M5 20v-4h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><span>Recurring</span></a>
      <a id="tab-goals" class="nav-link" href="#goals" data-view="goals"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg><span>Goals</span></a>
      <a id="tab-investments" class="nav-link" href="#investments" data-view="investments"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg><span>Investments</span></a>
    </div>
    <div class="nav-group">
      <span class="nav-head">Taxes</span>
      <a id="tab-capture" class="nav-link" href="#capture" data-view="capture"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg><span>Capture</span></a>
      <a id="tab-ledger" class="nav-link" href="#ledger" data-view="ledger"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v18H7z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/><path d="M10 8h4M10 12h4M10 16h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Ledger</span></a>
      <a id="tab-advisor" class="nav-link" href="#advisor" data-view="advisor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/></svg><span>Advisor</span></a>
      <a id="tab-insights" class="nav-link" href="#insights" data-view="insights"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M12 18l4.5-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="12" cy="18" r="1.6" fill="currentColor"/></svg><span>Insights</span></a>
      <a id="tab-worksheet" class="nav-link" href="#worksheet" data-view="worksheet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/><path d="M10 12h6M10 16h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg><span>Worksheet</span></a>
    </div>
    <div class="nav-group">
      <a id="tab-settings" class="nav-link" href="#settings" data-view="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h10M18 8h2M4 16h4M12 16h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="16" cy="8" r="2.2" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="10" cy="16" r="2.2" stroke="currentColor" stroke-width="2" fill="none"/></svg><span>Settings</span></a>
    </div>
  </nav>

  <main id="main" class="main" tabindex="-1">
    <nav id="taxNav" class="subnav" aria-label="Tax sections" hidden>
      <a href="#capture" data-view="capture">Capture</a>
      <a href="#ledger" data-view="ledger">Ledger</a>
      <a href="#advisor" data-view="advisor">Advisor</a>
      <a href="#insights" data-view="insights">Insights</a>
      <a href="#worksheet" data-view="worksheet">Worksheet</a>
    </nav>
    <section id="view-dashboard" class="view" aria-labelledby="tab-dashboard" hidden></section>
    <section id="view-accounts" class="view" aria-labelledby="tab-accounts" hidden></section>
    <section id="view-transactions" class="view" aria-labelledby="tab-transactions" hidden></section>
    <section id="view-cashflow" class="view" aria-labelledby="tab-cashflow" hidden></section>
    <section id="view-budget" class="view" aria-labelledby="tab-budget" hidden></section>
    <section id="view-recurring" class="view" aria-labelledby="tab-recurring" hidden></section>
    <section id="view-goals" class="view" aria-labelledby="tab-goals" hidden></section>
    <section id="view-investments" class="view" aria-labelledby="tab-investments" hidden></section>
    <section id="view-capture" class="view" aria-labelledby="tab-capture" hidden></section>
    <section id="view-ledger" class="view" aria-labelledby="tab-ledger" hidden></section>
    <section id="view-advisor" class="view" aria-labelledby="tab-advisor" hidden></section>
    <section id="view-insights" class="view" aria-labelledby="tab-insights" hidden></section>
    <section id="view-worksheet" class="view" aria-labelledby="tab-worksheet" hidden></section>
    <section id="view-settings" class="view" aria-labelledby="tab-settings" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Sections">
    <a class="tab" href="#dashboard" data-view="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 7h6V4h-6z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/></svg><span>Home</span></a>
    <a class="tab" href="#accounts" data-view="accounts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-5 9 5M5 10v7M10 10v7M14 10v7M19 10v7M3 20h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><span>Accounts</span></a>
    <a class="tab" href="#transactions" data-view="transactions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg><span>Transactions</span></a>
    <a class="tab" href="#budget" data-view="budget"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 4v8l6 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><span>Budget</span></a>
    <a class="tab" href="#capture" data-view="taxes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/><path d="M10 12h6M10 16h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg><span>Taxes</span></a>
    <a class="tab" href="#more" id="tabMore" data-view="more" role="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg><span>More</span></a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close="1"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" id="modalPanel"></div>
  </div>
  <input type="file" id="receiptInput" accept="image/*" capture="environment" hidden>
  <input type="file" id="receiptPick" accept="image/*" hidden>
  <input type="file" id="importInput" accept="application/json,.json" hidden>
  <input type="file" id="csvInput" accept=".csv,.txt,text/csv,text/plain,text/comma-separated-values,application/vnd.ms-excel,application/octet-stream" hidden>
  <input type="file" id="moneyFileInput" accept=".ofx,.qfx,.qbo,.csv,.txt,text/csv,text/plain,application/x-ofx,application/vnd.intu.qfx,application/octet-stream" hidden>
</div>

<script src="js/schema.js"></script>
<script src="js/rules.js"></script>
<script src="js/parse.js"></script>
<script src="js/classify.js"></script>
<script src="js/advisor.js"></script>
<script src="js/geo.js"></script>
<script src="js/importer.js"></script>
<script src="js/money.js"></script>
<script src="js/money-import.js"></script>
<script src="js/valuation.js"></script>
<script src="js/experiments.js"></script>
<script src="js/store.js"></script>
<script src="js/money-app.js"></script>
<script src="js/app.js"></script>
</body>
</html>
