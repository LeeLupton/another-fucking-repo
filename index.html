<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Itemizer</title>
<meta name="description" content="Keep track of deductible expenses through the year, know the moment itemizing beats the standard deduction, and hand your preparer a filled-in worksheet.">
<meta name="theme-color" content="#0e6b52" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Itemizer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <a class="brand" href="#capture" aria-label="Itemizer home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="5" fill="currentColor"/><path d="M9 11h14M9 16h9M9 21h11" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round"/><circle cx="23" cy="20.5" r="3.2" fill="var(--accent-ink)"/></svg>
      <span class="brand-name">Itemizer</span>
    </a>
    <div class="topbar-right">
      <label class="year-pick">
        <span class="year-pick-label">Tax year</span>
        <select id="yearSelect" aria-label="Tax year"></select>
      </label>
    </div>
  </header>

  <main id="main" class="main" tabindex="-1">
    <section id="view-capture" class="view" aria-labelledby="tab-capture" hidden></section>
    <section id="view-ledger" class="view" aria-labelledby="tab-ledger" hidden></section>
    <section id="view-advisor" class="view" aria-labelledby="tab-advisor" hidden></section>
    <section id="view-insights" class="view" aria-labelledby="tab-insights" hidden></section>
    <section id="view-worksheet" class="view" aria-labelledby="tab-worksheet" hidden></section>
    <section id="view-settings" class="view" aria-labelledby="tab-settings" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Sections">
    <a id="tab-capture" class="tab" href="#capture" data-view="capture">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      <span>Capture</span>
    </a>
    <a id="tab-ledger" class="tab" href="#ledger" data-view="ledger">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      <span>Ledger</span>
    </a>
    <a id="tab-advisor" class="tab" href="#advisor" data-view="advisor">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/></svg>
      <span>Advisor</span>
    </a>
    <a id="tab-insights" class="tab" href="#insights" data-view="insights">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M12 18l4.5-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="12" cy="18" r="1.6" fill="currentColor"/></svg>
      <span>Insights</span>
    </a>
    <a id="tab-worksheet" class="tab" href="#worksheet" data-view="worksheet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/><path d="M10 12h6M10 16h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      <span>Worksheet</span>
    </a>
    <a id="tab-settings" class="tab" href="#settings" data-view="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h10M18 8h2M4 16h4M12 16h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="16" cy="8" r="2.2" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="10" cy="16" r="2.2" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close="1"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" id="modalPanel"></div>
  </div>
  <input type="file" id="receiptInput" accept="image/*" capture="environment" hidden>
  <input type="file" id="importInput" accept="application/json,.json" hidden>
  <input type="file" id="csvInput" accept=".csv,text/csv,text/plain" hidden>
</div>

<script src="js/schema.js"></script>
<script src="js/rules.js"></script>
<script src="js/parse.js"></script>
<script src="js/classify.js"></script>
<script src="js/advisor.js"></script>
<script src="js/geo.js"></script>
<script src="js/importer.js"></script>
<script src="js/valuation.js"></script>
<script src="js/experiments.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
