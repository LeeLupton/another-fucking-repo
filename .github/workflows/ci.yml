name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check every module
        run: for f in js/*.js sw.js build.js; do node --check "$f"; done
      - name: Unit tests
        run: npm test
      - name: Single-file build
        run: npm run build
      # dist/ and the cache stamp in sw.js are committed. A change under js/ that was never built would
      # otherwise ship a stale download and leave installed clients on the previous cache version.
      - name: The committed build is current
        run: git diff --exit-code -- dist sw.js
      - uses: actions/upload-artifact@v4
        with:
          name: itemizer-single-file
          path: dist/itemizer.html
